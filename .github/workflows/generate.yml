name: Generate-32x32-color-grid

on:
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-color-grid
    steps:
      - uses: actions/checkout@v5

      - name: Run python generator
        run: python3 gen.py

      - name: Commit & Push
        run: |
          git config user.name yaojiale7067
          git config user.email 3871668737@qq.com
          git add color.svg color.log
          if git commit -m "generated"; then
            git push
          fi
